<!DOCTYPE html>
<html>
<head>

<title>No Due Form</title>

<link rel="stylesheet" href="/static/css/no_due_form.css">

</head>

<body>

<div class="header">

<h1>No Due Form</h1>

<div class="menu">

<a href="/no_due_form/">Student Details</a>

</div>

</div>


<div class="form-section">

<h2>Student Information</h2>

<form action="/no_due_table/" method="get">

<div class="row">

<div class="input-group">

<label>Student Name</label>

<input type="text" required>

</div>

<div class="input-group">

<label>Register Number</label>

<input type="text" required>

</div>

</div>


<div class="row">

<div class="input-group">

<label>Batch</label>

<input type="text" placeholder="2021 - 2025">

</div>

<div class="input-group">

<label>Year</label>

<select>

<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>Final Year</option>

</select>

</div>

</div>


<div class="row">

<div class="input-group">

<label>Department</label>

<input type="text" value="CSE">

</div>
<div class="input-group">

<label>Accommodation</label>

<select>

<option>Day Scholar</option>
<option>Hostel</option>

</select>

</div>


</div>


<button class="upload-btn">Next Page</button>

</form>

</div>

</body>
</html>
