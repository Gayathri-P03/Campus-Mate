{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Student Certificates</title>
    <link rel="stylesheet" href="{% static 'css/staff_certificates.css' %}">
</head>

<body>

<h2 style="text-align:center;">All Student Certificates</h2>

<table border="1" width="90%" align="center">

<tr>
    <th>Name</th>
    <th>Register No</th>
    <th>Year</th>
    <th>Date</th>
    <th>Organization</th>
    <th>File</th>
</tr>

{% for c in certificates %}
<tr>
    <td>{{ c.student_name }}</td>
    <td>{{ c.register_number }}</td>
    <td>{{ c.year }}</td>
    <td>{{ c.date }}</td>
    <td>{{ c.organization }}</td>
    <td>
        <a href="{{ c.certificate_file.url }}" target="_blank">View</a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
