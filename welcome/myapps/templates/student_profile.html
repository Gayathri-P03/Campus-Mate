<!DOCTYPE html>
<html>
<head>

<title>Student Profile</title>

<link rel="stylesheet" href="/static/css/no_due_form.css">

</head>

<body>

<div class="header">

<h1>Student Profile Data</h1>

<div class="menu">

<a href="/student_profile/">Profile</a>

</div>

</div>


<div class="form-section">

<h2>Student Details</h2>

<form action="/student_profile_table/" method="get">

<div class="row">

<div class="input-group">

<label>Name</label>

<input type="text" required>

</div>

<div class="input-group">

<label>Register Number</label>

<input type="text" required>

</div>

</div>


<div class="row">

<div class="input-group">

<label>Year</label>

<select>

<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>Final Year</option>

</select>

</div>

<div class="input-group">

<label>Batch</label>

<input type="text" placeholder="2021 - 2025">

</div>

</div>


<div class="row">

<div class="input-group">

<label>Semester</label>

<select>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>

</select>

</div>

<div class="input-group">

<label>Department</label>

<input type="text" value="CSE">

</div>

</div>


<button class="upload-btn">Next Page</button>

</form>

</div>

</body>
</html>
