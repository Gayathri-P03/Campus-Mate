// Draw path function
function drawRoute(userInput){

    var input = userInput.toLowerCase().trim();

    var matchedRoom = null;

    for(const roomName in rooms){

        var key = roomName.toLowerCase();

        if(input === key){
            matchedRoom = roomName;
            break;
        }

    }

    if(!matchedRoom){
        alert("Room not found");
        return;
    }

    route.setLatLngs([]);

    if(paths[matchedRoom]){
        route.setLatLngs(paths[matchedRoom]);
    }
    else{
        route.setLatLngs([entrance, rooms[matchedRoom]]);
    }

    map.fitBounds(route.getBounds(), {padding:[50,50]});

    document.getElementById("roomSearch").value = matchedRoom;

}
// Search button
document.getElementById("searchBtn").addEventListener("click", function(){
    var room = document.getElementById("roomSearch").value.trim();
    drawRoute(room);
});
